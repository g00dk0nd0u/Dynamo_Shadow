name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run fast repository checks
        run: |
          git diff --check
          python tools/check_runtime_bundle.py
          python -m compileall -q runtime tests tools -x '(^|[\\/])(\.git|\.pytest_cache|debug_logs)([\\/]|$)'
          python -m json.tool runtime/Shadow.dyn > /dev/null
          python tools/check_debug_log_privacy.py
          python -m pytest -q tests/unit/test_forward_vertical_slice_v0_parity.py
          dotnet test product/tests/ShadowCore.Tests.csproj --configuration Release
          dotnet test product/revit-tests/RevitShadow.Tests.csproj --configuration Release
          dotnet build product/dynamo/DynamoShadow.csproj --configuration Release
          dotnet build product/revit/RevitShadow.csproj --configuration Release

  python-regression:
    needs: fast-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Python/runtime-sensitive changes
        id: python-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_full=false
          while IFS= read -r changed_file; do
            case "$changed_file" in
              runtime/*|tests/*|*.py|.github/workflows/*|pyproject.toml|pytest.ini|tox.ini|setup.cfg|setup.py|requirements*.txt|Pipfile|Pipfile.lock|poetry.lock|uv.lock|.python-version)
                run_full=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.python-changes.outputs.run_full == 'true'
        with:
          python-version: "3.12"
      - name: Install test dependencies
        if: steps.python-changes.outputs.run_full == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run full Python regression suite
        if: steps.python-changes.outputs.run_full == 'true'
        run: python -m pytest -q
      - name: Skip full Python regression suite
        if: steps.python-changes.outputs.run_full != 'true'
        run: |
          echo "Full Python regression skipped: no Python/runtime-sensitive changes."
