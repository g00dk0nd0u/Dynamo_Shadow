name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run tests and repository checks
        run: |
          python -m pytest -q
          python tools/check_runtime_bundle.py
          python -m compileall -q runtime tests tools -x '(^|[\\/])(\.git|\.pytest_cache|debug_logs)([\\/]|$)'
          python -m json.tool runtime/Shadow.dyn > /dev/null
          python tools/check_debug_log_privacy.py
          dotnet test product/tests/ShadowCore.Tests.csproj --configuration Release
          dotnet build product/revit/RevitShadow.csproj --configuration Release
          git diff --check
