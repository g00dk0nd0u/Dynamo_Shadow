name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run tests and repository checks
        run: |
          python -m pytest -q
          python -m py_compile *.py tests/*.py
          python -m json.tool Shadow.dyn > /dev/null
          python tools/check_debug_log_privacy.py
          git diff --check
